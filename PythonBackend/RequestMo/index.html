<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #001f3f;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ── CONTAINER ── */
        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            background: #003366;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* ── HEADER ── */
        .chat-header {
            background: #001f3f;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #FFD700;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: white;
        }

        .chat-header span {
            font-size: 13px;
            color: #FFD700;
            margin-left: auto;
        }

        /* ── MESSAGES ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
        }

        .message.user {
            background: #FFD700;
            color: #001f3f;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: #001f3f;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message.thinking {
            background: #001f3f;
            color: #a8c4e0;
            align-self: flex-start;
            font-style: italic;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ── INPUT AREA ── */
        .input-area {
            padding: 16px 24px;
            background: #001f3f;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: #003366;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .input-area input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .input-area input:focus {
            border-color: #FFD700;
        }

        .send-btn {
            background: #FFD700;
            color: #001f3f;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .send-btn:hover {
            opacity: 0.85;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── WELCOME MESSAGE ── */
        .welcome {
            text-align: center;
            color: rgba(255,255,255,0.35);
            margin: auto;
            font-size: 15px;
        }

        .welcome p { margin-top: 8px; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="status-dot"></div>
            <h2>Local AI Chat</h2>
            <span>llama3 · local</span>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="welcome">
                <div style="font-size: 40px;">🤖</div>
                <p>Your local model is ready.</p>
                <p>Type a message to start chatting!</p>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
            />
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Send on Enter key
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function addMessage(text, role) {
            // Remove welcome message if present
            const welcome = messagesDiv.querySelector('.welcome');
            if (welcome) welcome.remove();

            const msg = document.createElement('div');
            msg.classList.add('message', role);
            msg.textContent = text;
            messagesDiv.appendChild(msg);

            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            return msg;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Show user message
            addMessage(text, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // Show thinking indicator
            const thinking = addMessage('Thinking...', 'thinking');

            try {
                // This will call our FastAPI backend
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // Replace thinking with actual response
                thinking.remove();
                addMessage(data.response, 'bot');

            } catch (error) {
                thinking.remove();
                addMessage('⚠️ Could not connect to backend. Make sure FastAPI is running on port 8000.', 'bot');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }
    </script>

</body>
</html>
